apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    compileSdkVersion 30
    defaultConfig {
        applicationId "ph.moneytrack"
        minSdkVersion 23
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'SUPABASE_URL', '"' + (project.findProperty('SUPABASE_URL') ?: 'https://rkwgxsxepldzvbajtlgg.supabase.co') + '"'
        buildConfigField 'String', 'SUPABASE_ANON_KEY', '"' + (project.findProperty('SUPABASE_ANON_KEY') ?: 'sb_publishable_-LEQQFtT6qMcMHs6fDlIJA_wSpyIENU') + '"'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'androidx.room:room-ktx:2.3.0'
    kapt 'androidx.room:room-compiler:2.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.2'
    implementation 'io.github.jan-tennert.supabase:gotrue-kt:1.1.0'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt:1.1.0'
}
